{% extends "base.html" %}{% block title %}Profile · HEMOVISION AI{% endblock %}
{% block content %}
<h2 class="fw-bold">Profile</h2>
<div class="row g-3">
 <div class="col-lg-7"><form method="post" class="hv-card p-4 row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="profile">
  <div class="col-12"><label class="form-label sage">Full Name</label><input class="form-control" name="full_name" value="{{ user.full_name }}" required></div>
  <div class="col-md-4"><label class="form-label sage">Age</label><input class="form-control" type="number" name="age" min="1" max="120" value="{{ user.age }}" required></div>
  <div class="col-md-4"><label class="form-label sage">Gender</label><select class="form-select" name="gender">{% for g in ["Male","Female","Other"] %}<option {{ 'selected' if user.gender==g }}>{{ g }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label sage">Blood Group</label><select class="form-select" name="blood_group"><option value="">—</option>{% for b in ["A+","A-","B+","B-","AB+","AB-","O+","O-"] %}<option {{ 'selected' if user.blood_group==b }}>{{ b }}</option>{% endfor %}</select></div>
  <div class="col-12"><label class="form-label sage">Phone</label><input class="form-control" name="phone" value="{{ user.phone }}" required></div>
  <div class="col-12"><button class="btn btn-wine">SAVE PROFILE</button></div></form></div>
 <div class="col-lg-5"><form method="post" class="hv-card p-4 d-grid gap-3"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="password">
  <h5 class="mb-0">Change password</h5>
  <input class="form-control" type="password" name="current" placeholder="Current password" required>
  <input class="form-control" type="password" name="password" placeholder="New password" required>
  <input class="form-control" type="password" name="confirm" placeholder="Confirm new password" required>
  <button class="btn btn-line">UPDATE PASSWORD</button></form></div>
</div>
{% endblock %}
